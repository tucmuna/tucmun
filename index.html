<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>

  <body class="bg-[#155E95] text-white overflow-x-hidden">

    <header
      class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-opacity-90 bg-gray-900 backdrop-blur-lg px-10 py-6 rounded-2xl shadow-lg z-50"
    >
      <div class="max-w-[80rem] mx-auto flex justify-between items-center gap-x-20">

        <div class="text-3xl font-bold text-blue-400 flex gap-x-2 items-center justify-center w-max">
          <img src="tucmunlogo.png" alt="Tucmun logo" class="h-16">
          <a href="home.html">TUCMUN</a>

        </div>

        <nav>
          <ul class="flex space-x-8 text-lg">
            <li><a href="about.html" class="hover:text-blue-400">About</a></li>
            <li>
              <a href="sec-gen.html" class="hover:text-blue-400">Conference</a>
            </li>
            <li>

            </li>
            <li>
              <a href="charity-letter.html" class="hover:text-blue-400"

              >
            </li>
            <li>
              <a href="keynote.html" class="hover:text-blue-400">Keynote</a>

            <li>

              >
            </li>
          </ul>
        </nav>
      </div>

    <div class="relative flex items-center justify-center h-screen text-center">
      <video

        class="absolute top-0 left-0 w-full h-full object-cover opacity-50"
      >
        <source
          src="Untitled video - Made with Clipchamp.mp4"
          type="video/mp4"
        />
      </video>
      <div

        <p class="text-5xl text-orange-300">"Roar The Truth"</p>
      </div>

    <main class="container mx-auto text-center space-y-10 py-20">
      <div class="grid md:grid-cols-3 gap-6">
        <div class="bg-blue-100 text-white p-6 rounded-lg flex flex-col items-center justify-center">
          <h2 class="text-3xl text-blue-900 font-semibold">April 11th (Friday) - 12th (Saturday)</h2>

        <div class="bg-yellow-600 text-white p-6 rounded-lg flex flex-col items-center justify-center">

          <h2 class="text-3xl ">Location</h2>
          <p>2910 N Parham Rd, Henrico, VA 23294</p>
        </div>
      </div>

      <div class="flex justify-center w-full">
        <a
          href="registration-details.html"
          class="bg-blue-100 duration-300 hover:bg-blue-200 text-white text-2xl font-semibold py-4 px-8 rounded-lg text-blue-950 font-semibold"

    <footer class="bg-gray-900 text-center py-10">
      <h2 class="text-7xl">TUCMUN</h2>
      <div class="flex justify-center space-x-6 mt-4">
        <a
          href="https://www.instagram.com/tucmun"
          class="text-white hover:text-blue-400 text-3xl"

        <a
          href="mailto:tucmunregistration@gmail.com"
